<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - Expense Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0 0 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
        }

        button,
        .back-button {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-button {
            background: #6b7280;
            color: white;
            margin-left: 8px;
        }

        .back-button:hover {
            background: #4b5563;
        }
    </style>
</head>

<body>

<header>
    <h1>Personal Expense & Budget Tracker</h1>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/expenses">Expenses</a>
        <a href="/add-expense">Add Expense</a>
        <a href="/budget">Budget</a>
        <a href="/reports">Reports</a>
    </nav>
</header>

<div class="container">

    <div class="form-card">

        <h2>Add New Expense</h2>

        <form method="POST">

            <label for="name">Expense Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Example: Groceries"
                required
            >

            <label for="category">Category</label>

            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Education">Education</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
            </select>

            <label for="amount">Amount (₹)</label>
            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0"
                placeholder="Example: 500"
                required
            >

            <label for="date">Date</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >

            <label for="note">Note</label>
            <textarea
                id="note"
                name="note"
                placeholder="Optional note"
            ></textarea>

            <div class="buttons">

                <button type="submit">
                    Save Expense
                </button>

                <a class="back-button" href="/expenses">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
